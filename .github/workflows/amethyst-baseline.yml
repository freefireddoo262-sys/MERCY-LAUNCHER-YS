
name: MERCY V25 - Amethyst baseline APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Amethyst source
        run: |
          git clone --recursive https://github.com/AngelAuraMC/Amethyst-Android.git amethyst

      - name: Prepare language list
        working-directory: amethyst
        run: bash scripts/languagelist_updater.sh

      - name: Build debug APK
        working-directory: amethyst
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app_pojavlauncher:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MERCY-V25-Amethyst-baseline-APK
          path: amethyst/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
